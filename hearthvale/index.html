<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2a20">
<meta name="description" content="Hearthvale: Farm und Siedlung in einem Tal. Bestell Felder, fäll Bäume, bau Häuser, Mühlen und Bäckereien und lass deine Siedler arbeiten. Ein Jahr, ein Talwert, eine Bestenliste.">
<meta property="og:type" content="website">
<meta property="og:title" content="Hearthvale">
<meta property="og:description" content="Farm und Siedlung in einem Tal: Felder, Siedler, Produktionsketten und das Tal der Woche.">
<meta property="og:url" content="https://timleonhardt.de/hearthvale/">
<title>Hearthvale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b2a20'/%3E%3Cpath d='M4 26 13 13l5 7 3-4 7 10z' fill='%236cb04a'/%3E%3Cpath d='M12 18h8v8h-8z' fill='%23efe2c8'/%3E%3Cpath d='M11 18.5 16 13l5 5.5z' fill='%23c0583f'/%3E%3Ccircle cx='24' cy='8' r='3' fill='%23f2b84b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: the valley fills the screen; HUD in the top corners, tools at the bottom, a side panel for buildings, modals for start, day end and year end. */
:root {
  --glass: rgba(20, 30, 24, 0.86);
  --glass-2: rgba(30, 44, 35, 0.92);
  --line: rgba(255, 255, 255, 0.12);
  --ink: #f3f1e8;
  --muted: #b7c2b4;
  --honey: #f2b84b;        /* accent */
  --leaf: #7cc35a;
  --bad: #f07a6a;
  --paper: #f6f2e6;
  --paper-ink: #24301f;
  --font: "Nunito", ui-rounded, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Fraunces", ui-serif, Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #1b2a20; color: var(--ink); font: 600 14px/1.4 var(--font); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--honey); outline-offset: 2px; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.ico { width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: middle; }

/* HUD oben links */
.hud { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 210px); pointer-events: none; }
.hud > * { pointer-events: auto; }
.clock { padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.clock .when { display: flex; flex-direction: column; }
.clock .when b { font: 800 16px/1.1 var(--font); }
.clock .when span { color: var(--muted); font-size: 12px; }
.stat { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-variant-numeric: tabular-nums; }
.energy { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; }
.energy .bar { width: 70px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.15); overflow: hidden; }
.energy .bar i { display: block; height: 100%; background: linear-gradient(90deg, #7cc35a, #c8e06a); }
.energy.low .bar i { background: var(--bad); }
.res { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; max-width: 560px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px 3px 4px; border-radius: 999px; background: rgba(255,255,255,0.06); font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.chip.zero { opacity: 0.45; }
.chip.pulse { animation: pulse 0.6s ease; }
@keyframes pulse { 40% { background: rgba(242,184,75,0.45); } }

/* oben rechts */
.topright { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
#mini { width: 180px; height: 144px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.18); display: block; background: #111; image-rendering: pixelated; }
.btnrow { display: flex; gap: 6px; }
.ibtn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--line); font-weight: 800; font-size: 17px; }
.ibtn:hover { border-color: rgba(255,255,255,0.35); }

/* Werkzeugleiste unten */
.bottom { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 8px; width: max-content; max-width: calc(100vw - 20px); }
.hint { padding: 6px 12px; font-size: 13px; color: var(--ink); border-radius: 999px; max-width: 92vw; text-align: center; }
.tools { display: flex; align-items: stretch; gap: 6px; padding: 6px; flex-wrap: wrap; justify-content: center; }
.tool { position: relative; min-width: 62px; padding: 7px 8px 6px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 800; }
.tool svg { width: 26px; height: 26px; }
.tool small { color: var(--muted); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tool.sel { border-color: var(--honey); background: rgba(242,184,75,0.14); }
.tool kbd { position: absolute; top: 3px; left: 5px; font: 700 9px/1 var(--font); color: var(--muted); }
.sep { width: 1px; background: var(--line); margin: 4px 2px; }
.speed { display: flex; flex-direction: column; gap: 3px; justify-content: center; }
.speed div { display: flex; gap: 3px; }
.speed button { min-width: 30px; padding: 5px 6px; border-radius: 7px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); font-size: 12px; font-weight: 800; }
.speed button.sel { background: var(--honey); color: #2a1e08; border-color: var(--honey); }

/* Seitenpanel */
.panel { position: fixed; right: max(10px, env(safe-area-inset-right, 0px)); top: calc(200px + env(safe-area-inset-top, 0px)); width: 330px; max-width: calc(100vw - 20px); max-height: calc(100vh - 300px); overflow-y: auto; padding: 14px; background: var(--glass-2); }
.panel h2 { margin: 0; font: 700 21px/1.1 var(--font-display); }
.panel .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.panel .x { background: none; border: 0; font-size: 22px; line-height: 1; color: var(--muted); padding: 0 2px; }
.panel p { margin: 6px 0; color: var(--muted); }
.panel .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.panel .row:first-of-type { border-top: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.07); font-weight: 800; }
.btn:hover:not(:disabled) { border-color: rgba(255,255,255,0.35); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--honey); color: #2a1e08; border-color: var(--honey); }
.btn.small { padding: 5px 8px; font-size: 12px; border-radius: 8px; }
.btn.danger { color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.blist { display: flex; flex-direction: column; gap: 6px; }
.bitem { text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,0.04); }
.bitem:hover:not(:disabled) { border-color: var(--honey); }
.bitem:disabled { opacity: 0.55; cursor: default; }
.bitem b { font-weight: 800; }
.bitem .cost { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.bitem .desc { grid-column: 1 / -1; color: var(--muted); font-size: 12px; font-weight: 600; }
.cost .chip.miss { color: var(--bad); background: rgba(240,122,106,0.12); }
.prog { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.12); overflow: hidden; margin: 6px 0; }
.prog i { display: block; height: 100%; background: var(--honey); }
.sellrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.sellrow .n { display: flex; align-items: center; gap: 6px; min-width: 0; }
.sellrow .n span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sellrow .b { display: flex; gap: 4px; }
.auto { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); grid-column: 1 / -1; }
.auto input[type=number] { width: 54px; background: rgba(0,0,0,0.25); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 5px; font: inherit; }

/* Toasts */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 5; }
.toast { padding: 8px 14px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--line); font-weight: 800; animation: tin 0.25s ease; }
@keyframes tin { from { transform: translateY(-8px); opacity: 0; } }

/* Modals */
.modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(10, 16, 12, 0.55); overflow-y: auto; }
.card { width: min(560px, 100%); background: var(--paper); color: var(--paper-ink); border-radius: 18px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); margin: auto; }
.card h1 { margin: 0; font: italic 800 clamp(44px, 9vw, 64px)/0.95 var(--font-display); letter-spacing: -0.02em; color: #2f4a26; }
.card h2 { margin: 0 0 6px; font: 700 26px/1.1 var(--font-display); color: #2f4a26; }
.card p { margin: 8px 0; color: #4d5a48; font-weight: 600; }
.card .lead { font-size: 15px; }
.card .btn { border-color: rgba(0,0,0,0.15); background: #ebe5d3; color: var(--paper-ink); }
.card .btn.primary { background: #2f4a26; color: #fff; border-color: #2f4a26; }
.card .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 12px; }
.card .box { background: #ece6d4; border-radius: 12px; padding: 12px; }
.card .box h3 { margin: 0 0 6px; font: 800 14px/1.2 var(--font); text-transform: uppercase; letter-spacing: 0.06em; color: #6b7a5a; }
.card ul { margin: 0; padding-left: 18px; color: #3d4a38; font-weight: 600; }
.card li { margin: 2px 0; }
.card .chips { display: flex; flex-wrap: wrap; gap: 5px; }
.card .chip { background: #fff8e6; color: var(--paper-ink); }
.card .big { font: 800 56px/1 var(--font-display); color: #2f4a26; font-variant-numeric: tabular-nums; }
.card dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; margin: 8px 0; }
.card dd { margin: 0; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.keys kbd { font: 800 12px/1 var(--font); background: #fff; border: 1px solid #d8d0bb; border-bottom-width: 2px; border-radius: 5px; padding: 3px 6px; color: #3d4a38; }
.lb ol { list-style: none; margin: 0; padding: 0; }
.lb li { display: grid; grid-template-columns: 2.2ch 1fr auto; gap: 8px; padding: 5px 6px; border-radius: 7px; }
.lb li.me { background: #fbe7b0; }
.lb li .r { color: #8a947f; font-weight: 800; text-align: right; }
.lb li .s { font-weight: 800; font-variant-numeric: tabular-nums; }
.lb .tabs { display: inline-flex; background: #e0d9c4; border-radius: 8px; padding: 3px; margin-bottom: 6px; }
.lb .tabs button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-weight: 800; font-size: 12px; color: #6b7a5a; }
.lb .tabs button[aria-selected="true"] { background: #fff; color: var(--paper-ink); }
.namerow { display: flex; gap: 6px; margin-top: 8px; }
.namerow input { flex: 1; min-width: 0; font: 700 15px var(--font); padding: 9px 10px; border-radius: 9px; border: 2px solid #d8d0bb; background: #fff; color: var(--paper-ink); }
.muted { color: #6b7a5a !important; font-size: 13px; }

@media (max-width: 720px) {
  #mini { width: 120px; height: 96px; }
  .hud { max-width: calc(100vw - 150px); }
  .res { max-width: 100%; }
  .chip { font-size: 12px; }
  .panel { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); max-height: 45vh; width: calc(100vw - 20px); }
  .tool { min-width: 52px; padding: 6px 5px; }
  .tool svg { width: 22px; height: 22px; }
  .clock .energy .bar { width: 50px; }
}
</style>
</head>
<body>
<canvas id="world" aria-label="Das Tal. Klick auf ein Feld, um dorthin zu gehen oder etwas zu tun."></canvas>

<div class="hud">
  <div class="glass clock">
    <div class="when"><b id="hDay">Tag 1 · Frühling</b><span id="hTime">6:00 · sonnig</span></div>
    <span class="stat" title="Münzen"><svg class="ico" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#f2b84b"/><circle cx="10" cy="10" r="5.5" fill="none" stroke="#c98a1b" stroke-width="1.5"/></svg><span id="hCoins">50</span></span>
    <button class="energy" id="hEnergy" type="button" title="Energie. Antippen, um etwas aus dem Lager zu essen.">
      <svg class="ico" viewBox="0 0 20 20"><path d="M11 1 4 11h5l-1 8 7-10h-5z" fill="#c8e06a"/></svg><span class="bar"><i id="hEnergyBar" style="width:100%"></i></span>
    </button>
    <span class="stat" title="Siedler: arbeitend / gesamt / Betten"><svg class="ico" viewBox="0 0 20 20"><circle cx="10" cy="6" r="3.5" fill="#f1c9a0"/><path d="M4 18c0-4 2.5-6.5 6-6.5s6 2.5 6 6.5z" fill="#5b7fa6"/></svg><span id="hPeople">0</span></span>
  </div>
  <div class="glass res" id="res"></div>
</div>

<div class="topright">
  <canvas id="mini" width="160" height="128" aria-label="Minikarte"></canvas>
  <div class="btnrow">
    <button class="ibtn" id="zoomOut" type="button" aria-label="Herauszoomen">−</button>
    <button class="ibtn" id="zoomIn" type="button" aria-label="Hineinzoomen">+</button>
    <button class="ibtn" id="helpBtn" type="button" aria-label="Hilfe">?</button>
    <button class="ibtn" id="menuBtn" type="button" aria-label="Menü">≡</button>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="bottom">
  <div class="glass hint" id="hint">Klick auf Bäume, Steine oder Beeren. Mit der Hacke legst du Felder an.</div>
  <div class="glass tools" id="tools">
    <button class="tool sel" data-tool="hand" type="button"><kbd>1</kbd><svg viewBox="0 0 26 26"><path d="M9 13V5.5a1.5 1.5 0 0 1 3 0V12V4a1.5 1.5 0 0 1 3 0v8V5.5a1.5 1.5 0 0 1 3 0V14c0 5-2.5 9-7 9-3 0-4.5-1.5-6-4l-2.5-4.5a1.5 1.5 0 0 1 2.5-1.5z" fill="#f1c9a0" stroke="#b58a63" stroke-width="1.2"/></svg>Hand<small>sammeln</small></button>
    <button class="tool" data-tool="hoe" type="button"><kbd>2</kbd><svg viewBox="0 0 26 26"><path d="M6 22 18 6" stroke="#8a5a30" stroke-width="2.6" stroke-linecap="round"/><path d="M15 4h7l-2 5-4-1z" fill="#9aa0a8"/></svg>Hacke<small>Feld</small></button>
    <button class="tool" data-tool="can" type="button"><kbd>3</kbd><svg viewBox="0 0 26 26"><path d="M6 10h12v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z" fill="#6aa8d8"/><path d="M18 13l6-5" stroke="#6aa8d8" stroke-width="2.6" stroke-linecap="round"/><path d="M8 10a4 4 0 0 1 8 0" fill="none" stroke="#4a88b8" stroke-width="2"/></svg>Kanne<small id="tWater">20/20</small></button>
    <button class="tool" data-tool="seed" type="button"><kbd>4</kbd><svg viewBox="0 0 26 26"><path d="M7 9h12l2 12H5z" fill="#cdb46a"/><path d="M9 9c0-3 2-5 4-5s4 2 4 5" fill="none" stroke="#a08a4a" stroke-width="2"/><circle cx="13" cy="15" r="2.4" fill="#7a5a2a"/></svg><span id="tSeedName">Weizen</span><small id="tSeed">10</small></button>
    <div class="sep"></div>
    <button class="tool" data-tool="build" type="button"><kbd>B</kbd><svg viewBox="0 0 26 26"><path d="M4 12 13 4l9 8" fill="none" stroke="#c0583f" stroke-width="2.6" stroke-linejoin="round"/><path d="M7 11h12v11H7z" fill="#efe2c8"/><path d="M11 16h4v6h-4z" fill="#8a5a30"/></svg>Bauen<small>Gebäude</small></button>
    <div class="sep"></div>
    <div class="speed" aria-label="Tempo">
      <div><button data-speed="0" type="button" aria-label="Pause">❚❚</button><button data-speed="1" class="sel" type="button">1×</button></div>
      <div><button data-speed="2" type="button">2×</button><button data-speed="3" type="button">3×</button></div>
    </div>
  </div>
</div>

<aside class="panel glass" id="panel" hidden aria-live="polite"></aside>
<div class="modal" id="modal" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script src="../lb-config.js"></script>
<script src="../lb.js"></script>
<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
