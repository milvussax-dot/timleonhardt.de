<style>
/* Layout: a field map on dark meadow green. Desktop: board left, a side panel with score, market and scoring rules. Phone: score, board, market, rules stacked. */
:root {
  --meadow: #1f3d2b;       /* page */
  --meadow-2: #2a5039;
  --paper: #f4f6ee;        /* panels */
  --ink: #17261c;
  --muted: #5d6f61;
  --grass: #cfe3b4;        /* empty plot */
  --grass-2: #bdd79d;
  --rule: #d9e2cf;
  --gold: #f2c94c;         /* coins, field */
  --forest: #6dbb75;
  --brick: #d9513c;
  --water: #6fc0ea;
  --market: #9a78e0;
  --good: #2f8f4e;
  --font-display: "Bitter", ui-serif, Georgia, serif;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--meadow); color: var(--ink); font: 400 15px/1.45 var(--font); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.home { color: #c9dbc6; text-decoration: none; font-weight: 500; font-size: 14px; }
.home:hover { color: #fff; }
.brand { font: 800 22px/1 var(--font-display); color: #fff; letter-spacing: -0.01em; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 15px; line-height: 1; padding: 13px 16px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; background: none; }
.btn-primary { background: var(--gold); color: var(--ink); }
.btn-primary:hover { filter: brightness(1.05); }
.btn-ghost { background: var(--paper); border-color: var(--rule); }
.btn-ghost:hover { border-color: var(--muted); }
.btn:disabled { opacity: 0.5; cursor: default; }
.panel { background: var(--paper); border-radius: 14px; padding: 18px; }
h2 { margin: 0; font: 800 20px/1.15 var(--font-display); }

/* ---------- Start ---------- */
.start { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .start { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; } }
.intro { display: flex; flex-direction: column; gap: 14px; }
.title { margin: 0; font: 800 clamp(46px, 9vw, 76px)/0.92 var(--font-display); letter-spacing: -0.03em; color: #fff; text-wrap: balance; }
.lede { margin: 0; color: #d6e4d2; font-size: 16px; max-width: 48ch; }
.start-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.start-actions .btn { padding: 15px 18px; font-size: 16px; }
.start-actions .btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,0.35); }
.today-best { margin: 0; color: #d6e4d2; font-size: 14px; }

/* ---------- Rules ---------- */
.rules { display: flex; flex-direction: column; gap: 10px; }
.rules ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.rules li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 14px; }
.rules li b { font-weight: 700; }
.rules svg { width: 30px; height: 30px; display: block; border-radius: 6px; }
.rules .small { margin: 0; color: var(--muted); font-size: 13px; }
details.rules-fold summary { cursor: pointer; font: 800 17px/1.2 var(--font-display); list-style: none; display: flex; align-items: center; justify-content: space-between; }
details.rules-fold summary::-webkit-details-marker { display: none; }
details.rules-fold summary::after { content: "+"; font: 700 20px/1 var(--font); color: var(--muted); }
details.rules-fold[open] summary::after { content: "–"; }
details.rules-fold[open] summary { margin-bottom: 10px; }

/* ---------- Game ---------- */
.game { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .game { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }
.hud { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--paper); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 500; }
.stat strong { font: 800 26px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat.coins strong { display: inline-flex; align-items: center; gap: 6px; }
.coin { width: 16px; height: 16px; border-radius: 50%; background: var(--gold); box-shadow: inset 0 -2px 0 #c99a1b; display: inline-block; flex: none; }

.board-wrap { background: var(--meadow-2); border-radius: 18px; padding: clamp(8px, 2vw, 14px); }
.board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: clamp(4px, 1vw, 7px); max-width: 620px; margin: 0 auto; }
.cell {
  position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 10px; cursor: default;
  background: var(--grass); box-shadow: inset 0 -3px 0 var(--grass-2); overflow: hidden;
}
.cell svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cell.can { cursor: pointer; }
.cell.can:hover, .cell.can:focus-visible { box-shadow: inset 0 0 0 3px var(--ink); }
.cell .pts {
  position: absolute; right: 4px; bottom: 4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
  background: rgba(23,38,28,0.82); color: #fff; font: 700 12px/20px var(--font); text-align: center; font-variant-numeric: tabular-nums;
}
.cell .pts.zero { background: rgba(23,38,28,0.35); }
.cell .delta {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 800 clamp(15px, 3.4vw, 22px)/1 var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums;
}
.cell .delta.best { color: var(--good); }
.cell .delta.none { color: rgba(23,38,28,0.35); }
.cell.ghost svg { opacity: 0.55; }
.cell.new { animation: drop 0.28s cubic-bezier(.2,1.5,.4,1); }
@keyframes drop { from { transform: scale(0.7); } to { transform: none; } }
.cell.changed .pts { animation: bump 0.5s ease; }
@keyframes bump { 40% { transform: scale(1.35); background: var(--good); } }

.side { display: flex; flex-direction: column; gap: 14px; }
.market { display: flex; flex-direction: column; gap: 10px; }
.market-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.market-head span { font-size: 13px; color: var(--muted); }
.offers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.offer {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 9px;
  border: 2px solid var(--rule); border-radius: 12px; background: #fff; cursor: pointer;
}
.offer svg { width: 52px; height: 52px; border-radius: 8px; display: block; }
.offer .name { font-weight: 700; font-size: 13px; }
.offer .price { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }
.offer .price .coin { width: 12px; height: 12px; }
.offer.sel { border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.offer:disabled { opacity: 0.45; cursor: default; }
.next-up { margin: 0; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.next-up svg { width: 22px; height: 22px; border-radius: 5px; }
.game-msg { margin: 0; min-height: 1.45em; font-size: 14px; color: var(--muted); }
.game-msg b { color: var(--ink); }
.game-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- End ---------- */
.end { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .end { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.final { display: flex; flex-direction: column; gap: 12px; }
.final .eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.final .total { display: flex; align-items: baseline; gap: 10px; }
.final .total strong { font: 800 72px/0.9 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.final .total span { color: var(--muted); font-weight: 500; }
.breakdown { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; font-size: 14px; }
.breakdown dt { display: flex; align-items: center; gap: 8px; }
.breakdown dt svg { width: 20px; height: 20px; border-radius: 4px; }
.breakdown dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.mini-board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; max-width: 200px; }
.mini-board i { aspect-ratio: 1; border-radius: 3px; background: var(--grass); display: block; }

/* ---------- Leaderboard ---------- */
.lb { display: flex; flex-direction: column; gap: 12px; }
.lb-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tabs { display: inline-flex; background: #e6ecdf; border-radius: 9px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 7px 11px; border-radius: 7px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--muted); }
.tabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
.lb-list { list-style: none; margin: 0 -8px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.lb-list li { display: grid; grid-template-columns: 2.4ch minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 8px; border-radius: 8px; }
.lb-list li.me { background: #fbecb5; }
.lb-list .r { color: var(--muted); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.lb-list li:nth-child(-n+3) .r { color: #b8860b; }
.lb-list .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-list .s { font: 800 16px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.lb-list li.empty { display: block; color: var(--muted); }
.lb-mine, .lb-status { margin: 0; font-size: 13px; color: var(--muted); }
.lb-mine b { color: var(--ink); }
.name-form { display: flex; flex-direction: column; gap: 6px; margin: 0; }
.name-form label { font-size: 14px; font-weight: 500; }
.name-row { display: flex; gap: 8px; }
.name-row input { flex: 1; min-width: 0; font: 500 16px/1.2 var(--font); padding: 11px 12px; border-radius: 10px; border: 2px solid var(--rule); background: #fff; color: var(--ink); }
.name-row input:focus { border-color: var(--ink); outline: none; }
.form-msg { margin: 0; font-size: 13px; color: var(--muted); }
.form-msg:empty { display: none; }

@media (prefers-reduced-motion: reduce) { .cell.new, .cell.changed .pts { animation: none; } }
@media (max-width: 420px) {
  .panel { padding: 14px; }
  .offer svg { width: 44px; height: 44px; }
  .stat strong { font-size: 22px; }
}
</style>
</head>

<script>
(() => {
  'use strict';
  const N = 6, TURNS = 30, START_COINS = 2, PRICES = [0, 1, 2];
  const BAG = { F: 8, W: 8, H: 8, T: 4, M: 5 };
  const TYPES = {
    F: { name: 'Feld', plural: 'Felder', rule: '1 Punkt, <b>+2</b> wenn ein Teich daneben liegt.' },
    W: { name: 'Wald', plural: 'Wälder', rule: '<b>1 Punkt</b> pro angrenzendem Wald.' },
    H: { name: 'Haus', plural: 'Häuser', rule: '<b>1 Punkt</b> pro verschiedener Sorte daneben (Feld, Wald, Teich, Markt). Bringt beim Bauen <b>1 Münze</b>.' },
    T: { name: 'Teich', plural: 'Teiche', rule: 'Selbst 0 Punkte, macht Felder daneben wertvoll.' },
    M: { name: 'Markt', plural: 'Märkte', rule: '<b>1 Punkt</b> pro Haus in derselben Zeile und Spalte.' },
  };
  const ORDER = ['F', 'W', 'H', 'T', 'M'];
  const $ = (id) => document.getElementById(id);
  const icon = (t, cls) => `<svg${cls ? ` class="${cls}"` : ''} viewBox="0 0 40 40" aria-hidden="true"><use href="#t-${t}"/></svg>`;
  const store = {
    get(k, d) { try { const s = localStorage.getItem(k); return s == null ? d : JSON.parse(s); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  };

  /* ---------- Seeded bag ---------- */
  function todayKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
  function todayLabel() { return new Date().toLocaleDateString('de-DE', { day: 'numeric', month: 'long' }); }
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function makeBag(seed) {
    const rnd = mulberry(hash(seed));
    const b = [];
    for (const t of ORDER) for (let i = 0; i < BAG[t]; i++) b.push(t);
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
    return b;
  }

  /* ---------- Scoring ---------- */
  function nbrs(i) {
    const x = i % N, y = Math.floor(i / N), out = [];
    if (x > 0) out.push(i - 1); if (x < N - 1) out.push(i + 1); if (y > 0) out.push(i - N); if (y < N - 1) out.push(i + N);
    return out;
  }
  function cellScore(g, i) {
    const t = g[i];
    if (t === 'F') return 1 + (nbrs(i).some((j) => g[j] === 'T') ? 2 : 0);
    if (t === 'W') return nbrs(i).filter((j) => g[j] === 'W').length;
    if (t === 'H') { const s = new Set(); nbrs(i).forEach((j) => { if (g[j] && g[j] !== 'H') s.add(g[j]); }); return s.size; }
    if (t === 'M') {
      const x = i % N, y = Math.floor(i / N); let n = 0;
      for (let k = 0; k < N; k++) { if (g[y * N + k] === 'H') n++; if (g[k * N + x] === 'H') n++; }
      return n;
    }
    return 0;
  }
  function boardPoints(g) { let s = 0; for (let i = 0; i < N * N; i++) if (g[i]) s += cellScore(g, i); return s; }
  function breakdown(g) {
    const b = { F: 0, W: 0, H: 0, T: 0, M: 0 };
    for (let i = 0; i < N * N; i++) if (g[i]) b[g[i]] += cellScore(g, i);
    return b;
  }

  /* ---------- State ---------- */
  let G = null;   // { mode, seed, bag, next, market, grid, coins, turn, sel, last, undoUsed }
  let lastScores = [];

  function newGame(mode) {
    const seed = mode === 'daily' ? `dorfplan:${todayKey()}` : `frei:${Date.now()}:${Math.random()}`;
    const bag = makeBag(seed);
    G = { mode, day: todayKey(), seed, bag, next: 3, market: bag.slice(0, 3), grid: Array(N * N).fill(null), coins: START_COINS, turn: 0, sel: firstAffordable(bag.slice(0, 3), START_COINS), last: null };
    lastScores = Array(N * N).fill(0);
    show('game');
    $('modeLabel').textContent = mode === 'daily' ? `Tagesdorf ${todayLabel()}` : 'Freies Dorf';
    say('Wähl ein Bauteil und tipp auf ein freies Feld. Die Zahlen zeigen, wie viele Punkte es dort sofort bringt.');
    render();
  }
  function firstAffordable(market, coins) { for (let i = 0; i < 3; i++) if (PRICES[i] <= coins) return i; return 0; }

  function place(cell) {
    if (!G || G.grid[cell] || G.sel == null || PRICES[G.sel] > G.coins) return;
    const t = G.market[G.sel];
    G.last = { cell, sel: G.sel, t, coins: G.coins, market: G.market.slice(), next: G.next };
    G.coins -= PRICES[G.sel];
    G.grid[cell] = t;
    if (t === 'H') G.coins += 1;
    G.market.splice(G.sel, 1);
    G.market.push(G.bag[G.next++]);
    G.turn++;
    G.sel = firstAffordable(G.market, G.coins);
    render(cell);
    const gained = boardPoints(G.grid) - boardPoints(withoutCell(G.grid, cell));
    say(`${TYPES[t].name} gebaut: <b>${gained >= 0 ? '+' : ''}${gained}</b> Punkte${t === 'H' ? ' und 1 Münze' : ''}.`);
    if (G.turn >= TURNS) setTimeout(finish, 450);
  }
  function withoutCell(g, cell) { const c = g.slice(); c[cell] = null; return c; }

  function undo() {
    if (!G || !G.last || G.turn >= TURNS) return;
    const l = G.last;
    G.grid[l.cell] = null; G.coins = l.coins; G.market = l.market; G.next = l.next; G.turn--; G.sel = l.sel; G.last = null;
    say('Zug zurückgenommen. Zurück geht immer nur ein Zug.');
    render();
  }

  /* ---------- Rendering ---------- */
  function say(html) { $('gameMsg').innerHTML = html; }

  function render(newCell) {
    const g = G.grid, total = boardPoints(g) + G.coins;
    $('hudScore').textContent = total;
    $('hudCoins').textContent = G.coins;
    $('hudTurn').textContent = `${Math.min(G.turn + 1, TURNS)}/${TURNS}`;
    $('undoBtn').disabled = !G.last;

    // previews for the selected offer
    const selT = G.sel != null && PRICES[G.sel] <= G.coins ? G.market[G.sel] : null;
    const base = boardPoints(g);
    const deltas = Array(N * N).fill(null);
    let best = -Infinity;
    if (selT && G.turn < TURNS) {
      for (let i = 0; i < N * N; i++) {
        if (g[i]) continue;
        g[i] = selT; deltas[i] = boardPoints(g) - base; g[i] = null;
        best = Math.max(best, deltas[i]);
      }
    }
    const boardEl = $('board');
    if (boardEl.children.length !== N * N) {
      boardEl.replaceChildren();
      for (let i = 0; i < N * N; i++) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'cell'; b.dataset.i = i;
        b.addEventListener('click', () => place(i));
        boardEl.append(b);
      }
    }
    [...boardEl.children].forEach((b, i) => {
      const t = g[i], sc = t ? cellScore(g, i) : 0;
      const can = !t && selT && G.turn < TURNS;
      b.className = 'cell' + (can ? ' can' : '') + (i === newCell ? ' new' : '') + (t && sc !== lastScores[i] && i !== newCell ? ' changed' : '');
      b.disabled = !can && !t;
      if (t) {
        b.innerHTML = icon(t) + `<span class="pts${sc ? '' : ' zero'}">${sc}</span>`;
        b.setAttribute('aria-label', `${TYPES[t].name}, ${sc} Punkte`);
        b.tabIndex = -1;
      } else if (can) {
        const d = deltas[i];
        b.innerHTML = `<span class="delta${d === best && d > 0 ? ' best' : ''}${d <= 0 ? ' none' : ''}">${d > 0 ? '+' + d : d}</span>`;
        b.setAttribute('aria-label', `Freies Feld, ${TYPES[selT].name} bringt hier ${d} Punkte`);
        b.tabIndex = 0;
      } else {
        b.innerHTML = '';
        b.setAttribute('aria-label', 'Freies Feld');
      }
      lastScores[i] = sc;
    });

    // market
    const offers = $('offers');
    offers.replaceChildren();
    G.market.forEach((t, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'offer' + (i === G.sel ? ' sel' : '');
      b.disabled = PRICES[i] > G.coins || G.turn >= TURNS;
      b.setAttribute('aria-pressed', String(i === G.sel));
      b.innerHTML = `${icon(t)}<span class="name">${TYPES[t].name}</span><span class="price">${PRICES[i] ? `<i class="coin"></i>${PRICES[i]} ${PRICES[i] === 1 ? 'Münze' : 'Münzen'}` : 'gratis'}</span>`;
      b.addEventListener('click', () => { G.sel = i; render(); });
      offers.append(b);
    });
    const upcoming = G.bag[G.next];
    $('nextUp').innerHTML = upcoming && G.turn < TURNS - 1 ? `Als Nächstes kommt: ${icon(upcoming)} <b>${TYPES[upcoming].name}</b>` : '';
  }

  function rulesHtml() {
    return `<ul>${ORDER.map((t) => `<li>${icon(t)}<span><b>${TYPES[t].name}:</b> ${TYPES[t].rule}</span></li>`).join('')}</ul>
      <p class="small">„Daneben“ heißt direkt links, rechts, oben oder unten. Am Markt ist das erste Teil gratis, das zweite kostet 1 Münze, das dritte 2. Übrige Münzen zählen am Ende als Punkte.</p>`;
  }

  /* ---------- Finish ---------- */
  function finish() {
    const g = G.grid, b = breakdown(g), total = boardPoints(g) + G.coins;
    G.final = total;
    $('endEyebrow').textContent = G.mode === 'daily' ? `Tagesdorf ${todayLabel()}` : 'Freies Dorf';
    $('endScore').textContent = total;
    $('breakdown').innerHTML = ORDER.filter((t) => t !== 'T').map((t) => `<dt>${icon(t)}${TYPES[t].plural}</dt><dd>${b[t]}</dd>`).join('')
      + `<dt><i class="coin"></i>Übrige Münzen</dt><dd>${G.coins}</dd>`;
    const colors = { F: '#f2c94c', W: '#6dbb75', H: '#d9513c', T: '#6fc0ea', M: '#9a78e0' };
    $('miniBoard').innerHTML = g.map((t) => `<i${t ? ` style="background:${colors[t]}"` : ''}></i>`).join('');
    if (G.mode === 'daily') {
      const best = store.get('dorf.best', {});
      if (!best[G.day] || total > best[G.day]) { best[G.day] = total; store.set('dorf.best', best); }
      LB.tab = 'day';
      LB.pending = total;
    } else {
      LB.pending = null;
    }
    show('end');
    renderLb('lbEnd');
    if (G.mode === 'daily' && TB && TB.getName()) submitIfNamed(); else loadLb(LB.tab);
  }

  /* ---------- Leaderboard (gemeinsam für alle Spiele, ../lb.js) ---------- */
  const TB = window.TLBoard || null;
  const ONLINE = !!(TB && TB.configured);
  const LB = { tab: 'day', data: { day: null, all: null }, state: { day: ONLINE ? 'loading' : 'off', all: ONLINE ? 'loading' : 'off' }, pending: null, submitted: false, renaming: false, busy: false };
  const boardId = (tab) => (tab === 'day' ? `plot-twist:day:${todayKey()}` : 'plot-twist');

  async function loadLb(tab) {
    if (!ONLINE) return;
    try { LB.data[tab] = await TB.board(boardId(tab), 10); LB.state[tab] = 'live'; }
    catch (e) { LB.state[tab] = 'offline'; }
    renderAllLb();
  }
  async function submitIfNamed() {
    if (!ONLINE || LB.pending == null || LB.busy) return;
    const name = TB.getName();
    if (!name) { renderAllLb(); return; }
    LB.busy = true;
    try {
      await TB.submit(boardId('day'), name, LB.pending);
      await TB.submit(boardId('all'), name, LB.pending);
      LB.submitted = true;
    } catch (e) {
      LB.error = e && e.code === 'rejected' ? 'Das hat die Bestenliste nicht angenommen. Versuch einen anderen Namen.' : 'Keine Verbindung zur Bestenliste. Versuch es gleich nochmal.';
    }
    LB.busy = false;
    await Promise.all([loadLb('day'), loadLb('all')]);
  }

  function renderAllLb() { if (!$('startView').hidden) renderLb('lbStart'); if (!$('endView').hidden) renderLb('lbEnd'); }

  function renderLb(rootId) {
    const root = $(rootId), tab = LB.tab, d = LB.data[tab], st = LB.state[tab];
    const name = TB ? TB.getName() : '';
    const showForm = ONLINE && rootId === 'lbEnd' && LB.pending != null && (!name || LB.renaming || LB.error);
    root.innerHTML = `
      <div class="lb-head"><h2>Bestenliste</h2>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="day" aria-selected="${tab === 'day'}">Heute</button>
          <button type="button" role="tab" data-tab="all" aria-selected="${tab === 'all'}">Allzeit</button>
        </div>
      </div>
      <ol class="lb-list"></ol>
      <p class="lb-mine" hidden></p>
      ${showForm ? `<form class="name-form" novalidate>
        <label for="nameIn">Dein Name für die Bestenliste</label>
        <div class="name-row"><input id="nameIn" type="text" maxlength="16" autocomplete="nickname" spellcheck="false" enterkeyhint="done" placeholder="z. B. Dorfschulze"><button class="btn btn-primary" type="submit">Eintragen</button></div>
        <p class="form-msg" role="status"></p>
      </form>` : ''}
      <p class="lb-status"></p>`;
    const ol = root.querySelector('.lb-list');
    const rows = d ? d.top : [];
    if (!rows.length) {
      const li = document.createElement('li'); li.className = 'empty';
      li.textContent = st === 'loading' ? 'Bestenliste lädt …' : st === 'offline' ? 'Die Bestenliste ist gerade nicht erreichbar.' : st === 'off' ? 'Die Bestenliste ist noch nicht verbunden.'
        : tab === 'day' ? 'Heute hat noch niemand gespielt. Mach den Anfang.' : 'Noch keine Einträge.';
      ol.append(li);
    } else {
      rows.forEach((r, i) => {
        const li = document.createElement('li'); if (r.me) li.className = 'me';
        const a = document.createElement('span'); a.className = 'r'; a.textContent = i + 1;
        const n = document.createElement('span'); n.className = 'n'; n.textContent = r.name;
        const s = document.createElement('span'); s.className = 's'; s.textContent = Math.round(r.score);
        li.append(a, n, s); ol.append(li);
      });
    }
    const mine = root.querySelector('.lb-mine');
    if (d && d.me && !rows.some((r) => r.me)) { mine.hidden = false; mine.append('Du: Platz ', Object.assign(document.createElement('b'), { textContent: d.me.rank }), ` mit ${Math.round(d.me.score)} Punkten`); }
    const status = root.querySelector('.lb-status');
    if (ONLINE && name && !showForm) {
      status.append(`Du spielst als `, Object.assign(document.createElement('b'), { textContent: name }), '. ');
      const ch = document.createElement('button'); ch.type = 'button'; ch.textContent = 'Ändern';
      ch.style.cssText = 'background:none;border:0;padding:0;color:var(--good);font-weight:700;cursor:pointer;text-decoration:underline;font-size:inherit';
      ch.addEventListener('click', () => { if (rootId === 'lbEnd' && LB.pending != null) { LB.renaming = true; renderLb(rootId); } else renameInline(root); });
      status.append(ch);
    } else if (ONLINE && rootId === 'lbStart' && !name) {
      status.textContent = 'Nach dem Tagesdorf kannst du dich mit Namen eintragen. Das freie Dorf zählt nicht.';
    }
    root.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { LB.tab = b.dataset.tab; renderLb(rootId); if (!LB.data[LB.tab]) loadLb(LB.tab); }));
    const form = root.querySelector('.name-form');
    if (form) {
      const input = form.querySelector('input'), msg = form.querySelector('.form-msg');
      input.value = name;
      if (LB.error) msg.textContent = LB.error;
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const n = TB.cleanName(input.value);
        if (!n) { msg.textContent = 'Gib einen Namen ein.'; return; }
        TB.setName(n); LB.renaming = false; LB.error = null;
        msg.textContent = 'Wird eingetragen …';
        submitIfNamed();
      });
    }
  }
  // Name ändern in der Übersicht: kleines Formular an Ort und Stelle
  function renameInline(root) {
    const status = root.querySelector('.lb-status');
    status.innerHTML = `<form class="name-form" novalidate><label for="renameIn">Neuer Name</label><div class="name-row"><input id="renameIn" type="text" maxlength="16" autocomplete="nickname" spellcheck="false"><button class="btn btn-primary" type="submit">Speichern</button></div></form>`;
    const f = status.querySelector('form'), inp = f.querySelector('input');
    inp.value = TB.getName(); inp.focus();
    f.addEventListener('submit', (e) => { e.preventDefault(); const n = TB.cleanName(inp.value); if (!n) return; TB.setName(n); LB.renaming = false; renderLb(root.id); });
  }

  /* ---------- Views ---------- */
  function show(v) {
    $('startView').hidden = v !== 'start';
    $('gameView').hidden = v !== 'game';
    $('endView').hidden = v !== 'end';
    $('brand').hidden = v === 'start';
    window.scrollTo(0, 0);
    if (v === 'start') {
      LB.pending = null; LB.renaming = false; LB.error = null;
      const best = store.get('dorf.best', {})[todayKey()];
      $('todayBest').textContent = best ? `Dein Bestwert heute: ${best} Punkte. Du kannst so oft spielen, wie du willst.` : `Heute für alle dieselben Teile. Du kannst so oft spielen, wie du willst.`;
      $('dailyBtn').textContent = `Tagesdorf ${todayLabel()} spielen`;
      renderLb('lbStart');
      loadLb(LB.tab);
    }
  }

  $('dailyBtn').addEventListener('click', () => newGame('daily'));
  $('freeBtn').addEventListener('click', () => newGame('free'));
  $('againBtn').addEventListener('click', () => newGame(G ? G.mode : 'daily'));
  $('menuBtn').addEventListener('click', () => show('start'));
  $('undoBtn').addEventListener('click', undo);
  $('quitBtn').addEventListener('click', () => { G = null; show('start'); });
  window.addEventListener('keydown', (e) => {
    if ($('gameView').hidden || e.target.tagName === 'INPUT') return;
    if (e.key === '1' || e.key === '2' || e.key === '3') { const i = Number(e.key) - 1; if (PRICES[i] <= G.coins) { G.sel = i; render(); } }
    else if ((e.key === 'z' || e.key === 'Z') && !e.metaKey && !e.ctrlKey) undo();
  });

  $('rulesStart').innerHTML = '<h2>Wertung</h2>' + rulesHtml();
  $('rulesGameBody').innerHTML = rulesHtml();
  if (window.matchMedia && matchMedia('(min-width: 900px)').matches) $('rulesGame').open = true;
  show('start');
  window.__dorf = { makeBag, boardPoints, cellScore, breakdown, state: () => G };   // für Tests
})();
</script>
</body>
</html>
